name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests (router, config, assets, docs)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify build artifacts
        run: npm run verify:build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kelvin-zero-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    name: Headless WebGL2 browser smoke
    runs-on: ubuntu-latest
    needs: unit-and-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
          echo "Chrome: ${BIN:-<not on PATH>}"
          if [ -n "$BIN" ]; then "$BIN" --version; fi

      - name: Run browser smoke test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          {
            echo '### Headless browser smoke output'
            echo '```'
            tail -n 160 smoke.log
            echo '```'
            echo "Chrome path: \`${CHROME_PATH:-<auto-detected>}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-log
          path: smoke.log
          if-no-files-found: ignore
          retention-days: 7
